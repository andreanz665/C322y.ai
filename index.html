<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C322y.ai — Agen AI</title>
<style>
:root{--bg:#050f2e;--gold:#ffc61a;--gold2:#ffe27a;--ink:#f1f5ff;--mut:#9fb0d6;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(700px 420px at 100% 100%,rgba(255,198,26,.35),transparent 65%),radial-gradient(700px 500px at 0% 25%,rgba(30,107,255,.45),transparent 65%),linear-gradient(180deg,#040c26,var(--bg) 40%,#0a2a75);background-attachment:fixed;display:flex;flex-direction:column}
button,select{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(4,12,38,.7)}
.ico{background:none;border:0;color:var(--ink);padding:6px;display:grid;place-items:center;border-radius:8px}
.ico:hover{background:var(--card)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-.5px}
.mark{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:900 32px/1 Georgia,serif;letter-spacing:0;color:#ffd84a;background:linear-gradient(145deg,#3d7bff,#0b3a9e 55%,#061a4a);box-shadow:inset 0 2px 2px rgba(255,255,255,.55),inset 0 -3px 4px rgba(0,0,0,.45),0 4px 0 #041a55,0 8px 14px rgba(0,0,0,.5),0 0 18px rgba(255,198,26,.35);transform:perspective(220px) rotateX(12deg) rotateY(-16deg);text-shadow:1px 1px 0 #f0b400,2px 2px 0 #d99a00,3px 3px 0 #b87d00,4px 4px 0 #8f5f00,5px 7px 8px rgba(0,0,0,.55)}
.mark::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.mark:hover{animation-play-state:paused}
@media(prefers-reduced-motion:no-preference){.mark{animation:fl 4s ease-in-out infinite}}
@keyframes fl{50%{transform:perspective(220px) rotateX(8deg) rotateY(14deg) translateY(-2px)}}
.logo b{color:var(--gold)}
.sp{flex:1}
#newc{display:none;color:var(--gold);border:1px solid var(--gold);padding:7px 12px;font-size:14px;font-weight:700}
body.chat #newc{display:block}
main{flex:1;overflow-y:auto;padding:0 18px 28px;display:flex;flex-direction:column}
.hero{text-align:center;padding-top:28px;max-width:720px;margin:0 auto;width:100%}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,198,26,.5);background:rgba(255,198,26,.1);color:var(--gold);padding:9px 18px;border-radius:999px;font-weight:600;font-size:15px}
.pill svg{width:18px;height:18px}
h1{font-size:clamp(28px,7vw,44px);line-height:1.15;margin:26px 0 12px;letter-spacing:-1px}
.sub{color:var(--mut);margin:0 auto 26px;max-width:32em;line-height:1.5}
.comp{background:rgba(20,28,58,.75);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;backdrop-filter:blur(8px)}
#prev{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#prev:not(:empty){margin-bottom:10px}
.th{position:relative}.th img{height:62px;border-radius:8px;display:block}.th audio{height:40px;max-width:240px}
.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#061a4a;border:0;padding:0;font-weight:800}
.recb{color:#ff8a8a;font-weight:600;font-size:14px}
textarea{width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:17px;resize:none;min-height:84px;max-height:200px;padding:4px}
textarea::placeholder{color:#7c8db8}
textarea:focus-visible{outline:none}
.bar{display:flex;align-items:center;gap:6px;margin-top:8px}
.bar .ico{color:var(--mut)}.bar .ico:hover{color:var(--gold)}
.mode{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px}
.mode select{appearance:none;background:none;border:0;color:var(--ink);font-size:15px;padding:10px 6px}
.mode select option{color:#000}
.send{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#061a4a;border:0;display:grid;place-items:center}
.send:hover{background:var(--gold2)}.send:disabled{opacity:.5;cursor:wait}
.rec{color:#ff5a5a!important;background:rgba(255,90,90,.15)}
#note{color:#ffb4b4;font-size:13px;margin-top:8px;min-height:0}
.tp{display:flex;align-items:center;gap:10px;margin:30px auto 14px;max-width:720px;width:100%;font-weight:700;font-size:18px}
.tp .tag{margin-left:auto;border:1px solid rgba(255,198,26,.5);background:rgba(255,198,26,.1);color:var(--gold);padding:7px 14px;border-radius:999px;font-size:14px}
.cards{display:grid;gap:12px;max-width:720px;width:100%;margin:0 auto}
.card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--ink)}
.card:hover{border-color:var(--gold)}
.card strong{display:block;margin-bottom:4px;color:var(--gold)}
.card span{color:var(--mut);font-size:14px;line-height:1.45}
#log{display:none;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto;padding-top:16px;text-align:left}
.msg{max-width:92%;padding:12px 16px;border-radius:16px;line-height:1.65;word-wrap:break-word;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--gold);color:#061a4a;border-bottom-right-radius:4px;white-space:pre-wrap}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;width:100%}
.ai.err{color:#ffb4b4}
.msg img{display:block;max-width:220px;max-height:220px;border-radius:10px;margin-bottom:8px}
.msg audio{display:block;max-width:100%;margin-bottom:8px}
.tx>:first-child{margin-top:0}.tx>:last-child{margin-bottom:0}
.tx p{margin:0 0 .8em}
.tx h4{margin:1.1em 0 .4em;font-size:17px;color:var(--gold)}
.tx ul,.tx ol{margin:0 0 .8em;padding-left:1.3em}.tx li{margin:.25em 0}
.tx code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px;font:13.5px Consolas,monospace}
.tx pre{background:#030b22;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:0 0 .8em}
.tx pre code{background:none;padding:0;white-space:pre}
.tx a{color:var(--gold2)}
.tw{overflow-x:auto;margin:0 0 .8em}
.tx table{border-collapse:collapse;font-size:14px;min-width:100%}
.tx th,.tx td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.tx th{background:rgba(255,198,26,.14);color:var(--gold2)}
.msg img.gen{max-width:100%;max-height:none;margin:10px 0 6px}
.dl{display:inline-block;color:var(--gold2);font-size:13px;margin-right:10px}
.cpy{margin-top:10px;background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 10px;font-size:12.5px}
.cpy:hover{color:var(--gold);border-color:var(--gold)}
body.chat .hero .pill,body.chat .hero h1,body.chat .hero .sub,body.chat .tp,body.chat .cards{display:none}
body.chat #log{display:flex;flex:1}
body.chat .hero{padding-top:0}
body.chat main{padding-bottom:0}
body.chat .dock{position:sticky;bottom:0;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,#06154a 30%)}
.cam{position:fixed;inset:0;background:rgba(3,10,32,.94);display:grid;place-items:center;z-index:9;padding:16px}
.cam>div{background:#061a4a;border:1px solid var(--gold);border-radius:18px;padding:14px;max-width:560px;width:100%}
video{width:100%;border-radius:12px;background:#000;display:block}
.cam .row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.cam .row button{border-radius:10px;padding:10px 16px;border:1px solid var(--gold);background:none;color:var(--gold);font-weight:700}
.cam .row .go{background:var(--gold);color:#061a4a}
.hint{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><div class="mark" aria-hidden="true">C</div><span>C322y<b>.ai</b></span></div>
  <div class="sp"></div>
  <button class="ico" id="newc">Percakapan baru</button>
</header>

<main id="main">
  <section class="hero">
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>Tips: kirim foto atau voice note</div>
    <h1>Mau ngerjain apa hari ini?</h1>
    <p class="sub">Ceritakan tugasnya dengan bahasa sehari-hari, atau kirim foto dan voice note. Sisanya biar agen C322y yang kerja.</p>
    <div id="log" aria-live="polite"></div>
    <div class="dock">
      <div class="comp">
        <div id="prev"></div>
        <textarea id="txt" placeholder="Contoh: jelaskan isi foto ini dan buatkan ringkasannya" aria-label="Pesan"></textarea>
        <div class="bar">
          <button class="ico" id="up" aria-label="Unggah foto" title="Unggah foto"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="ico" id="cm" aria-label="Ambil foto dengan kamera" title="Kamera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z"/></svg></button>
          <div class="mode"><select id="mode" aria-label="Mode"><option value="tanya">Tanya</option><option value="rencana">Rencana</option><option value="gambar">Gambar</option></select></div>
          <div class="sp"></div>
          <button class="ico" id="mic" aria-label="Rekam voice note" title="Voice note"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3"/></svg></button>
          <button class="send" id="send" aria-label="Kirim"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <div id="note" role="alert"></div>
      </div>
    </div>
  </section>

  <div class="tp"><svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h7v6H4zM15 14h5v6h-5z"/></svg>Pilih template awal siap pakai<span class="tag">Coba langsung</span></div>
  <div class="cards">
    <button class="card" data-p="Analisis foto yang saya kirim: jelaskan objek, teks, dan hal penting di dalamnya."><strong>Analisis foto</strong><span>Kirim foto, dapatkan penjelasan objek, teks, dan detailnya.</span></button>
    <button class="card" data-p="Bantu saya menyusun rencana langkah demi langkah untuk proyek berikut: " data-m="rencana"><strong>Susun rencana proyek</strong><span>Ubah ide jadi daftar langkah yang jelas dan berurutan.</span></button>
    <button class="card" data-p="Tulis dan jelaskan kode untuk: "><strong>Tulis atau perbaiki kode</strong><span>Minta kode baru, atau tempel kode yang error untuk diperbaiki.</span></button>
  </div>
</main>

<div class="cam" id="cam" hidden role="dialog" aria-label="Kamera">
  <div>
    <video id="vid" autoplay playsinline muted></video>
    <div class="row"><button class="go" id="snap">Ambil foto</button><button id="flip">Balik kamera</button><button id="cc">Tutup</button></div>
    <div class="hint" id="camerr"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let imgs=[],hist=[],voice=null,stream=null,facing="user",mr=null,chunks=[],tick=null,t0=0;
const note=m=>$("note").textContent=m||"";
const down=()=>{$("main").scrollTop=1e9};

$("newc").onclick=()=>{hist=[];imgs=[];voice=null;$("log").innerHTML="";document.body.classList.remove("chat");note("");renderPrev()};
document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{$("txt").value=c.dataset.p;if(c.dataset.m)$("mode").value=c.dataset.m;$("txt").focus()});

/* ---------- Markdown rapi & aman ---------- */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inl=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
function md(t){
  const L=t.replace(/\r/g,"").split("\n"),o=[];let i=0,m;
  const UL=/^\s*[-*]\s+/,OL=/^\s*\d+[.)]\s+/,row=r=>r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>inl(c.trim()));
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;o.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`);continue}
    if(m=l.match(/^#{1,4}\s+(.*)/)){o.push(`<h4>${inl(m[1])}</h4>`);i++;continue}
    if(UL.test(l)){const b=[];while(i<L.length&&UL.test(L[i]))b.push(`<li>${inl(L[i++].replace(UL,""))}</li>`);o.push(`<ul>${b.join("")}</ul>`);continue}
    if(OL.test(l)){const b=[];while(i<L.length&&OL.test(L[i]))b.push(`<li>${inl(L[i++].replace(OL,""))}</li>`);o.push(`<ol>${b.join("")}</ol>`);continue}
    if(l.includes("|")&&/^[\s|:-]+$/.test(L[i+1]||"")&&(L[i+1]||"").includes("-")){const h=row(l);i+=2;const b=[];while(i<L.length&&L[i].includes("|"))b.push(row(L[i++]));o.push(`<div class="tw"><table><tr>${h.map(c=>`<th>${c}</th>`).join("")}</tr>${b.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`);continue}
    if(!l.trim()){i++;continue}
    const b=[inl(L[i++])];while(i<L.length&&L[i].trim()&&!/^(```|#{1,4}\s)/.test(L[i])&&!UL.test(L[i])&&!OL.test(L[i]))b.push(inl(L[i++]));
    o.push(`<p>${b.join("<br>")}</p>`);
  }
  return o.join("");
}

/* ---------- Foto ---------- */
function shrink(src){return new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};i.src=src})}
function addImg(u){if(imgs.length>=4)return note("Maksimal 4 foto per pesan.");imgs.push(u);renderPrev()}
function renderPrev(){
  const p=$("prev");p.innerHTML="";
  if(mr){const s=Math.floor((Date.now()-t0)/1000);p.innerHTML=`<span class="recb">● Merekam ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} — ketuk mikrofon untuk selesai</span>`}
  if(voice){const d=document.createElement("div");d.className="th";d.innerHTML=`<audio controls src="${voice.url}"></audio><button aria-label="Hapus voice note">×</button>`;d.querySelector("button").onclick=()=>{voice=null;renderPrev()};p.appendChild(d)}
  imgs.forEach((u,n)=>{const d=document.createElement("div");d.className="th";d.innerHTML=`<img src="${u}" alt="Foto ${n+1}"><button aria-label="Hapus foto">×</button>`;d.querySelector("button").onclick=()=>{imgs.splice(n,1);renderPrev()};p.appendChild(d)});
}
$("up").onclick=()=>$("file").click();
$("file").onchange=e=>{for(const f of e.target.files){const r=new FileReader();r.onload=async()=>addImg(await shrink(r.result));r.readAsDataURL(f)}e.target.value=""};

/* ---------- Kamera (depan sebagai default) ---------- */
async function openCam(){
  $("cam").hidden=false;$("camerr").textContent="";
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});
    $("vid").srcObject=stream;$("vid").style.transform=facing==="user"?"scaleX(-1)":"";
  }catch(e){$("camerr").textContent="Kamera tidak bisa dibuka. Izinkan akses kamera dan buka situs lewat https."}
}
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("cam").hidden=true}
$("cm").onclick=openCam;$("cc").onclick=closeCam;
$("flip").onclick=()=>{facing=facing==="user"?"environment":"user";openCam()};
$("snap").onclick=async()=>{const v=$("vid");if(!v.videoWidth)return;const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);addImg(await shrink(c.toDataURL("image/jpeg",.9)));closeCam()};

/* ---------- Voice note (direkam lalu diubah ke WAV agar dibaca Gemini) ---------- */
async function toWav(blob){
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const buf=await ctx.decodeAudioData(await blob.arrayBuffer());ctx.close();
  const sr=16000,len=Math.max(1,Math.ceil(buf.duration*sr)),oc=new OfflineAudioContext(1,len,sr),src=oc.createBufferSource();
  src.buffer=buf;src.connect(oc.destination);src.start();
  const d=(await oc.startRendering()).getChannelData(0),v=new DataView(new ArrayBuffer(44+len*2));
  const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF");v.setUint32(4,36+len*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){const x=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}
  const by=new Uint8Array(v.buffer);let bin="";for(let i=0;i<by.length;i+=8192)bin+=String.fromCharCode.apply(null,by.subarray(i,i+8192));
  return{b64:btoa(bin),url:URL.createObjectURL(new Blob([by],{type:"audio/wav"}))};
}
$("mic").onclick=async()=>{
  if(mr){mr.stop();return}
  note("");
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];const r=new MediaRecorder(st);mr=r;
    r.ondataavailable=e=>chunks.push(e.data);
    r.onstop=async()=>{
      clearInterval(tick);st.getTracks().forEach(t=>t.stop());$("mic").classList.remove("rec");
      const blob=new Blob(chunks,{type:r.mimeType});mr=null;
      try{voice=await toWav(blob)}catch(e){note("Voice note gagal diproses. Coba rekam lagi.")}
      renderPrev();
    };
    r.start();t0=Date.now();$("mic").classList.add("rec");renderPrev();
    tick=setInterval(()=>{if(Date.now()-t0>=45000)r.stop();else renderPrev()},500);
  }catch(e){mr=null;note("Mikrofon tidak bisa diakses. Izinkan akses mikrofon dan buka situs lewat https.")}
};

/* ---------- Chat ---------- */
function bubble(cls,pics,aud){
  document.body.classList.add("chat");
  const d=document.createElement("div");d.className="msg "+cls;
  (pics||[]).forEach(u=>{const i=document.createElement("img");i.src=u;i.alt="Foto terkirim";d.appendChild(i)});
  if(aud){const a=document.createElement("audio");a.controls=true;a.src=aud;d.appendChild(a)}
  const t=document.createElement("div");t.className="tx";d.appendChild(t);$("log").appendChild(d);down();return t;
}
async function send(){
  if(mr)return note("Selesaikan rekaman dulu (ketuk mikrofon).");
  const text=$("txt").value.trim();
  if(!text&&!imgs.length&&!voice)return;
  note("");
  const pics=imgs.slice(),vo=voice;imgs=[];voice=null;renderPrev();$("txt").value="";
  const media=pics.map(u=>({m:"image/jpeg",d:u.split(",")[1]}));if(vo)media.push({m:"audio/wav",d:vo.b64});
  const msg=text||(vo?"Dengarkan voice note ini dan jawab.":"Jelaskan foto ini.");
  bubble("me",pics,vo&&vo.url).textContent=text||(vo&&!pics.length?"":"");
  hist.push({role:"user",text:msg,media});
  const wantImg=$("mode").value==="gambar"||/(buat|bikin|gambarkan|lukis|generate|desain)\w*\b.*\b(gambar|logo|ilustrasi|poster|wallpaper|kartun)/i.test(text);const out=bubble("ai");out.textContent=wantImg?"C322y sedang membuat gambar…":"C322y sedang mengetik…";$("send").disabled=true;
  const contents=hist.map((h,n)=>({role:h.role,parts:[...(n===hist.length-1?h.media.map(x=>({inline_data:{mime_type:x.m,data:x.d}})):[]),{text:h.text+(n<hist.length-1&&h.media.length?" [melampirkan media]":"")}]}));
  const body=JSON.stringify({contents,mode:wantImg?"gambar":$("mode").value});
  try{
    if(body.length>4200000)throw new Error("Lampiran terlalu besar. Kurangi jumlah foto atau durasi voice note.");
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body});
    let d;try{d=await r.json()}catch(e){throw new Error("Server belum aktif. Pastikan situs di-deploy bersama folder api")}
    if(!r.ok||d.error)throw new Error(d.error||("Kesalahan "+r.status));
    out.innerHTML=md(d.text||"");hist.push({role:"model",text:d.text||"[Gambar dibuat]",media:[]});
    (d.images||[]).forEach((g,n)=>{const u=`data:${g.mime};base64,${g.data}`,im=document.createElement("img"),a=document.createElement("a");im.src=u;im.alt="Gambar buatan C322y";im.className="gen";a.href=u;a.download=`c322y-${n+1}.png`;a.className="dl";a.textContent="Unduh gambar";out.appendChild(im);out.appendChild(a)});
    const b=document.createElement("button");b.className="cpy";b.textContent="Salin";
    b.onclick=async()=>{try{await navigator.clipboard.writeText(d.text);b.textContent="Tersalin"}catch(e){b.textContent="Gagal"}setTimeout(()=>b.textContent="Salin",1500)};
    out.parentElement.appendChild(b);
  }catch(e){hist.pop();out.parentElement.classList.add("err");out.textContent="Gagal: "+e.message}
  $("send").disabled=false;down();
}
$("send").onclick=send;
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}});
</script>
